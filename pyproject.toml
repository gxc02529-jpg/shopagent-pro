[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopagent-pro"
version = "1.0.0"
description = "Enterprise-ready omnichannel e-commerce multi-agent customer service platform"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "gxc02529-jpg"}]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
infra = ["redis>=5.2,<8.0", "httpx>=0.27,<1.0"]
enterprise = [
  "redis>=5.2,<8.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "httpx>=0.27,<1.0",
]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.3,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.9,<1.0",
]
quality = ["pytest-cov>=6.0,<8.0"]
rag = ["numpy>=1.26,<3.0", "sentence-transformers>=3.3,<6.0"]
release = ["pip-tools>=7.4,<8.0"]

[project.urls]
Repository = "https://github.com/gxc02529-jpg/shopagent-pro"
Documentation = "https://github.com/gxc02529-jpg/shopagent-pro#readme"

[project.scripts]
shopagent-api = "shopagent.api:run"
shopagent-token = "shopagent.security.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopagent = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires live infrastructure services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.run]
branch = true
source = ["shopagent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

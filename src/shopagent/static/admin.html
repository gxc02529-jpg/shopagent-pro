<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopAgent 运营闭环</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#1a2438;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0}button,input{border-radius:9px;border:1px solid #ccd5e3;padding:9px 12px}button{background:#3974e9;color:#fff;border:0;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e1e7f0;border-radius:15px;padding:18px;box-shadow:0 8px 28px #2442700d}.number{font-size:28px;font-weight:800;margin-top:8px}.label{font-size:13px;color:#77849a}.panel{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #edf0f5;padding:11px 8px;font-size:14px}th{color:#6f7c91}.actions{display:flex;gap:6px}.reject{background:#fff;color:#d64b55;border:1px solid #efcbd0}.empty{color:#8591a5;padding:28px;text-align:center}.auth{display:flex;gap:8px}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;gap:12px;flex-direction:column}.panel{overflow:auto}}
</style></head><body><main class="shell"><header><div><h1>运营与知识闭环</h1><div class="label">服务 → 反馈 → 审核 → 发布 → 再服务</div></div><div class="auth"><input id="token" type="password" placeholder="管理员令牌"><button onclick="loadAll()">刷新</button></div></header>
<section class="cards"><div class="card"><div class="label">总咨询量</div><div class="number" id="total">-</div></div><div class="card"><div class="label">自动解决率</div><div class="number" id="auto">-</div></div><div class="card"><div class="label">转人工率</div><div class="number" id="handoff">-</div></div><div class="card"><div class="label">平均评分</div><div class="number" id="rating">-</div></div></section>
<section class="panel"><h2>待审核知识候选</h2><div id="candidates" class="empty">输入管理员令牌后加载</div></section><section class="panel"><h2>最近审计事件</h2><div id="audits" class="empty">输入管理员令牌后加载</div></section></main>
<script>
const token=document.querySelector('#token');token.value=localStorage.shopagent_admin_token||'';
function headers(){localStorage.shopagent_admin_token=token.value;return token.value.startsWith('v1.')?{Authorization:'Bearer '+token.value}:{'X-Admin-Token':token.value}}
async function loadAll(){const [d,c,a]=await Promise.all([fetch('/api/v1/admin/dashboard',{headers:headers()}),fetch('/api/v1/admin/knowledge-candidates?status=pending',{headers:headers()}),fetch('/api/v1/admin/audit-events?limit=30',{headers:headers()})]);if(d.status===401){alert('管理员令牌错误');return}const data=await d.json();document.querySelector('#total').textContent=data.total_interactions;document.querySelector('#auto').textContent=(data.automation_rate*100).toFixed(1)+'%';document.querySelector('#handoff').textContent=(data.handoff_rate*100).toFixed(1)+'%';document.querySelector('#rating').textContent=data.average_rating??'-';renderCandidates(await c.json());renderAudits(await a.json())}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function renderCandidates(items){const el=document.querySelector('#candidates');if(!items.length){el.className='empty';el.textContent='暂无待审核候选';return}el.className='';el.innerHTML=`<table><thead><tr><th>问题</th><th>原因</th><th>建议答案</th><th>操作</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.question)}</td><td>${esc(x.reason)}</td><td>${esc(x.suggested_answer||x.current_answer)}</td><td><div class="actions"><button onclick="review('${x.id}',true)">发布</button><button class="reject" onclick="review('${x.id}',false)">拒绝</button></div></td></tr>`).join('')}</tbody></table>`}
function renderAudits(items){const el=document.querySelector('#audits');if(!items.length){el.className='empty';el.textContent='暂无审计事件';return}el.className='';el.innerHTML=`<table><thead><tr><th>时间</th><th>事件</th><th>操作者</th><th>对象</th><th>Trace</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.event_type)}</td><td>${esc(x.actor_id)}</td><td>${esc(x.entity_id)}</td><td>${esc(x.trace_id||'-')}</td></tr>`).join('')}</tbody></table>`}
async function review(id,approved){const r=await fetch(`/api/v1/admin/knowledge-candidates/${id}/review`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({approved})});if(!r.ok){alert('审核失败');return}loadAll()}
if(token.value)loadAll();
</script></body></html>

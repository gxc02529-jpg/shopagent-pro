apiVersion: v1
kind: ConfigMap
metadata:
  name: shopagent-config
data:
  SHOPAGENT_ENV: production
  SHOPAGENT_MEMORY_BACKEND: redis
  SHOPAGENT_OPERATIONS_BACKEND: mysql
  SHOPAGENT_AGENT_TRANSPORT: a2a
  SHOPAGENT_TOOL_TRANSPORT: mcp
  SHOPAGENT_A2A_BASE_URL: http://shopagent/a2a
  SHOPAGENT_MCP_URL: http://shopagent/mcp
  SHOPAGENT_PUBLIC_BASE_URL: https://customer-service.example.com
  SHOPAGENT_REDIS_KEY_PREFIX: shopagent
  SHOPAGENT_CORS_ORIGINS: https://customer-service.example.com
  SHOPAGENT_GUARDRAILS_ENABLED: "true"
  SHOPAGENT_REDACT_GENERATED_ANSWERS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopagent
spec:
  replicas: 3
  selector:
    matchLabels: {app: shopagent}
  template:
    metadata:
      labels: {app: shopagent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shopagent
          image: ghcr.io/gxc02529-jpg/shopagent-pro:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: shopagent-config}
            - secretRef: {name: shopagent-secrets}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: shopagent}
---
apiVersion: v1
kind: Service
metadata:
  name: shopagent
spec:
  selector: {app: shopagent}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopagent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: shopagent}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopagent
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: shopagent}
